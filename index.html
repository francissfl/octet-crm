if(S.th)document.documentElement.dataset.theme=S.th;
function nav(v){cur=v;render()}
function render(){
 const nb=NAV.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="nav('${k}')"><svg class="i" viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>${l}</button>`).join('');
 $('#bn').innerHTML=nb;
 $('#side').innerHTML='<div class="lg"><i>O</i>Octet</div>'+NAV.map(([k,l])=>`<button class="nv ${k===cur?'on':''}" onclick="nav('${k}')"><svg class="i" viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>${l}</button>`).join('');
 $('#ttl').textContent=TT[cur];
 $('#main').innerHTML=({dash,clients,stock,ventes,sav})[cur]();
 scrollTo(0,0)}
function modal(h){$('#md').innerHTML='<div class="mc">'+h+'</div>';$('#md').classList.add('on')}
function closeM(){$('#md').classList.remove('on')}
function dash(){
 const mo=new Date().toISOString().slice(0,7);
 const sales=S.d.filter(d=>d.t==='Facture'&&d.s==='Payé'&&d.dt.startsWith(mo)).reduce((a,d)=>a+tot(d),0);
 const pend=S.d.filter(d=>d.s==='En attente').length;
 const low=S.p.filter(p=>p.q<3),pc=Math.min(100,sales/S.goal*100);
 const cnt=s=>S.r.filter(r=>r.s===s).length,open=S.r.filter(r=>r.s!=='Récupéré');
 const sg=ST.map(s=>`<div class="${PC[s]}" style="flex:${Math.max(cnt(s),.4)}" title="${s}">${cnt(s)}</div>`).join('');
 return`<div class="g g4"><div class="cd"><div class="k">Ventes du mois</div><div class="v">${F(sales)}</div><div class="bar"><b style="width:${pc}%"></b></div><div class="k" style="margin-top:4px">${Math.round(pc)} % de l’objectif (${F(S.goal)})</div></div>
 <div class="cd"><div class="k">Documents en attente</div><div class="v">${pend}</div></div>
 <div class="cd"><div class="k">Articles en stock bas</div><div class="v">${low.length}</div></div>
 <div class="cd"><div class="k">Réparations ouvertes</div><div class="v">${open.length}</div></div></div>
 <div class="g g2" style="margin-top:12px">
 <div class="cd"><h3>Atelier de réparation</h3><div class="seg">${sg}</div><div class="k">${ST.map(s=>s+' : '+cnt(s)).join(' · ')}</div>
 ${open.map(r=>`<div class="ln"><span>${E(r.mc)}<br><small class="k">${E(cl(r.c).nom)}</small></span>${pill(r.s)}</div>`).join('')||'<div class="em">Aucune réparation ouverte.</div>'}</div>
 <div class="cd"><h3>Alertes de stock (moins de 3 unités)</h3>${low.map(p=>`<div class="ln"><span>${E(p.ma+' '+p.mo)}</span><span class="pl ${p.q?'wa':'er'}">${p.q} en stock</span></div>`).join('')||'<div class="em">Tout est bien approvisionné.</div>'}</div>
 <div class="cd"><h3>Derniers clients</h3>${S.c.slice(-4).reverse().map(c=>`<div class="ln" style="cursor:pointer" onclick="fiche(${c.id})"><span>${E(c.nom)}</span><span class="k">${E(c.ville)}</span></div>`).join('')}</div>
 <div class="cd"><h3>Dernières ventes</h3>${S.d.slice(-4).reverse().map(d=>`<div class="ln"><span>${d.n} · ${E(cl(d.c).nom)}</span><span>${F(tot(d))} ${pill(d.s)}</span></div>`).join('')}</div></div>`}
function clients(){
 return`<div class="bar2"><button class="bt" onclick="fClient()">Ajouter un client</button></div>
 <div class="tw"><table><tr><th>Client</th><th>Téléphone</th><th>Ville</th><th>Achats</th><th>Machines</th></tr>
 ${S.c.map(c=>{const a=S.d.filter(d=>d.c==c.id&&d.t==='Facture'&&d.s==='Payé').reduce((x,d)=>x+tot(d),0);return`<tr class="cl" onclick="fiche(${c.id})"><td><b>${E(c.nom)}</b><br><small class="k">${E(c.email)}</small></td><td>${E(c.tel)}</td><td>${E(c.ville)}</td><td>${F(a)}</td><td>${c.m.length}</td></tr>`}).join('')}</table></div>`}
function fiche(id){
 closeM();const c=cl(id),ds=S.d.filter(d=>d.c==id),rs=S.r.filter(r=>r.c==id);
 modal(`<h2>${E(c.nom)}</h2><div class="k">${E(c.tel)} · ${E(c.email)} · ${E(c.ville)}</div>
 <h3>Ordinateurs actuels</h3>${c.m.map(m=>`<div class="ln"><span>${E(m.n)}</span><span class="k">N° ${E(m.sn)}</span></div>`).join('')||'<div class="k">Aucune fiche technique.</div>'}
 <h3>Devis et factures</h3>${ds.map(d=>`<div class="ln"><span>${d.n} · ${d.dt}</span><span>${F(tot(d))} ${pill(d.s)}</span></div>`).join('')||'<div class="k">Aucun document.</div>'}
 <h3>Réparations</h3>${rs.map(r=>`<div class="ln"><span>${E(r.mc)} — ${E(r.sy)}</span>${pill(r.s)}</div>`).join('')||'<div class="k">Aucune réparation.</div>'}
 <div class="bar2" style="margin-top:14px"><button class="bt" onclick="closeM();fDoc(${id})">Nouveau devis</button><button class="bt s" onclick="closeM()">Fermer</button></div>`)}
function fClient(){modal(`<h2>Nouveau client</h2><div class="f"><label>Nom<input id="a1"></label><label>Téléphone<input id="a2" type="tel"></label><label>E-mail<input id="a3" type="email"></label><label>Ville<input id="a4"></label><label>Ordinateur actuel (optionnel)<input id="a5" placeholder="Modèle"></label><label>N° de série<input id="a6"></label></div><div class="bar2" style="margin-top:12px"><button class="bt" onclick="addC()">Enregistrer le client</button><button class="bt s" onclick="closeM()">Annuler</button></div>`)}
function addC(){const n=$('#a1').value.trim();if(!n){$('#a1').focus();return}
 S.c.push({id:nid(S.c),nom:n,tel:$('#a2').value,email:$('#a3').value,ville:$('#a4').value,m:$('#a5').value?[{n:$('#a5').value,sn:$('#a6').value}]:[]});save();closeM();render()}
function stock(){
 const q=fS.q.toLowerCase(),L=S.p.filter(p=>(!fS.cat||p.cat===fS.cat)&&(!fS.et||p.et===fS.et)&&(p.ma+' '+p.mo+' '+p.cpu+' '+p.gpu).toLowerCase().includes(q));
 const o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 return`<div class="bar2"><input placeholder="Filtrer (marque, CPU, GPU…)" value="${E(fS.q)}" oninput="fS.q=this.value;fl()"><select onchange="fS.cat=this.value;fl()"><option value="">Toutes catégories</option>${o(['Portable','Bureau','Gaming','Composant','Accessoire'],fS.cat)}</select><select onchange="fS.et=this.value;fl()"><option value="">Neuf et reconditionné</option>${o(['Neuf','Reconditionné'],fS.et)}</select><button class="bt" onclick="fProd()">Ajouter un produit</button></div><div id="sl">${stT(L)}</div>`}
function stT(L){return`<div class="tw"><table><tr><th>Produit</th><th>CPU</th><th>RAM</th><th>Stockage</th><th>GPU</th><th>État</th><th>Prix</th><th>Stock</th></tr>${L.map(p=>`<tr class="${p.q<3?'low':''}"><td><b>${E(p.ma+' '+p.mo)}</b><br><small class="k">${E(p.cat)}</small></td><td>${E(p.cpu)}</td><td>${E(p.ram)}</td><td>${E(p.sto)}</td><td>${E(p.gpu)}</td><td>${pill(p.et)}</td><td>${F(p.px)}</td><td><button class="qb" onclick="adj(${p.id},-1)">−</button> <span class="pl ${p.q<3?(p.q?'wa':'er'):'ok'}">${p.q}</span> <button class="qb" onclick="adj(${p.id},1)">+</button></td></tr>`).join('')||'<tr><td colspan="8" class="em">Aucun produit ne correspond.</td></tr>'}</table></div>`}
function fl(){const q=fS.q.toLowerCase();$('#sl').innerHTML=stT(S.p.filter(p=>(!fS.cat||p.cat===fS.cat)&&(!fS.et||p.et===fS.et)&&(p.ma+' '+p.mo+' '+p.cpu+' '+p.gpu).toLowerCase().includes(q)))}
function adj(id,n){const p=pr(id);p.q=Math.max(0,p.q+n);save();fl()}
function fProd(){modal(`<h2>Nouveau produit</h2><div class="f"><label>Marque<input id="a1"></label><label>Modèle<input id="a2"></label><label>CPU<input id="a3"></label><label>RAM<input id="a4" placeholder="16 Go"></label><label>Stockage<input id="a5" placeholder="512 Go SSD"></label><label>GPU<input id="a6"></label><label>État<select id="a7"><option>Neuf</option><option>Reconditionné</option></select></label><label>Catégorie<select id="a8"><option>Portable</option><option>Bureau</option><option>Gaming</option><option>Composant</option><option>Accessoire</option></select></label><label>Prix (MAD)<input id="a9" type="number" min="0"></label><label>Quantité<input id="a10" type="number" min="0" value="1"></label></div><div class="bar2" style="margin-top:12px"><button class="bt" onclick="addP()">Enregistrer le produit</button><button class="bt s" onclick="closeM()">Annuler</button></div>`)}
function addP(){const g=i=>$('#a'+i).value;if(!g(2).trim()){$('#a2').focus();return}
 S.p.push({id:nid(S.p),ma:g(1),mo:g(2),cpu:g(3)||'—',ram:g(4)||'—',sto:g(5)||'—',gpu:g(6)||'—',et:g(7),cat:g(8),px:+g(9)||0,q:+g(10)||0});save();closeM();render()}
function ventes(){
 return`<div class="bar2"><button class="bt" onclick="fDoc()">Créer un devis</button></div><div class="tw"><table><tr><th>Document</th><th>Client</th><th>Date</th><th>Total</th><th>Statut</th><th></th></tr>
 ${S.d.slice().reverse().map(d=>`<tr><td><b>${d.n}</b><br><small class="k">${d.t}</small></td><td>${E(cl(d.c).nom)}</td><td>${d.dt}</td><td>${F(tot(d))}</td><td><select onchange="setS(${d.id},this.value)">${(d.t==='Devis'?['En attente','Annulé']:['En attente','Payé','Annulé']).map(s=>`<option ${s===d.s?'selected':''}>${s}</option>`).join('')}</select></td><td>${d.t==='Devis'&&d.s==='En attente'?`<button class="bt s" onclick="conv(${d.id})">Passer en facture</button>`:''}</td></tr>`).join('')}</table></div>`}
function setS(id,v){const d=S.d.find(x=>x.id==id);d.s=v;if(d.t==='Facture'&&v==='Payé'&&!d.sd){d.l.forEach(l=>{const p=pr(l.p);if(p.q!==undefined)p.q=Math.max(0,p.q-l.q)});d.sd=1}save();render()}
function conv(id){const d=S.d.find(x=>x.id==id);d.t='Facture';d.n='F-2026-'+String(19+S.d.filter(x=>x.t==='Facture').length).padStart(3,'0');d.s='En attente';d.dt=dA(0);save();render()}
function fDoc(cid){
 const po='<option value="">—</option>'+S.p.map(p=>`<option value="${p.id}">${E(p.ma+' '+p.mo)} · ${F(p.px)}</option>`).join('');
 modal(`<h2>Nouveau devis</h2><div class="f"><label>Client<select id="dc">${S.c.map(c=>`<option value="${c.id}" ${c.id==cid?'selected':''}>${E(c.nom)}</option>`).join('')}</select></label>
 ${[0,1,2].map(i=>`<label>Article ${i+1}<select id="p${i}">${po}</select></label><label>Quantité<input id="q${i}" type="number" min="1" value="1"></label>`).join('')}</div>
 <div class="bar2" style="margin-top:12px"><button class="bt" onclick="addD()">Enregistrer le devis</button><button class="bt s" onclick="closeM()">Annuler</button></div>`)}
function addD(){const l=[0,1,2].filter(i=>$('#p'+i).value).map(i=>{const p=pr($('#p'+i).value);return{p:p.id,q:Math.max(1,+$('#q'+i).value||1),px:p.px}});
 if(!l.length){$('#p0').focus();return}
 S.d.push({id:nid(S.d),n:'D-2026-'+String(32+S.d.filter(x=>x.t==='Devis').length).padStart(3,'0'),t:'Devis',c:+$('#dc').value,l,s:'En attente',dt:dA(0),sd:0});save();closeM();nav('ventes')}
function sav(){
 return`<div class="bar2"><button class="bt" onclick="fRep()">Déposer une machine</button></div><div class="g g4" style="align-items:start">${ST.map(s=>`<div><div style="margin-bottom:8px">${pill(s)}</div>${S.r.filter(r=>r.s===s).map(r=>`<div class="rc"><b>${E(r.mc)}</b><br><small class="k">${E(cl(r.c).nom)} · N° ${E(r.sn)}</small><div style="margin:6px 0">${E(r.sy)}</div><small class="k">Pièces : ${E(r.pi)||'—'}</small><br><select onchange="setR(${r.id},this.value)">${ST.map(x=>`<option ${x===r.s?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<div class="k">Aucune machine.</div>'}</div>`).join('')}</div>`}
function setR(id,v){S.r.find(x=>x.id==id).s=v;save();render()}
function fRep(){modal(`<h2>Déposer une machine</h2><div class="f"><label>Client<select id="a1">${S.c.map(c=>`<option value="${c.id}">${E(c.nom)}</option>`).join('')}</select></label><label>Machine<input id="a2"></label><label>N° de série<input id="a3"></label><label>Symptômes de la panne<input id="a4"></label><label>Pièces à changer<input id="a5"></label></div><div class="bar2" style="margin-top:12px"><button class="bt" onclick="addR()">Enregistrer le dépôt</button><button class="bt s" onclick="closeM()">Annuler</button></div>`)}
function addR(){if(!$('#a2').value.trim()){$('#a2').focus();return}
 const c=cl($('#a1').value);S.r.push({id:nid(S.r),c:+$('#a1').value,mc:$('#a2').value,sn:$('#a3').value,sy:$('#a4').value,pi:$('#a5').value,s:'Diagnostiqué',dt:dA(0)});
 if($('#a3').value&&!c.m.some(m=>m.sn===$('#a3').value))c.m.push({n:$('#a2').value,sn:$('#a3').value});save();closeM();render()}
function srch(q){q=q.toLowerCase().trim();const b=$('#sr');if(q.length<2){b.hidden=true;return}
 const R=[],has=s=>s.toLowerCase().includes(q);
 S.c.forEach(c=>{if(has(c.nom+' '+c.tel+' '+c.email))R.push(['Client',c.nom,c.ville,`fiche(${c.id})`]);c.m.forEach(m=>{if(has(m.n+' '+m.sn))R.push(['N° de série',m.sn+' · '+m.n,c.nom,`fiche(${c.id})`])})});
 S.p.forEach(p=>{if(has(p.ma+' '+p.mo+' '+p.cpu+' '+p.cat))R.push(['Produit',p.ma+' '+p.mo,p.q+' en stock',`nav('stock')`])});
 S.r.forEach(r=>{if(has(r.s+' '+r.mc+' '+r.sn+' '+cl(r.c).nom))R.push(['Réparation',r.mc+' · '+r.s,cl(r.c).nom,`nav('sav')`])});
 b.hidden=false;b.innerHTML=R.slice(0,12).map(r=>`<div class="ri" onclick="${r[3]};$('#sr').hidden=true;$('#q').value=''"><span class="pl in">${r[0]}</span><span>${E(r[1])}<br><small>${E(r[2])}</small></span></div>`).join('')||'<div class="em">Aucun résultat.</div>'}
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))$('#sr').hidden=true});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
<script>
NAV[0][1]='Dashboard';NAV[2][1]='Stocks';
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
function render(){
 const mk=(a,c)=>a.map(([k,l])=>`<button class="${c} ${k===cur?'on':''}" onclick="nav('${k}')"><svg class="i" viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>${l}</button>`).join('');
 $('#bn').innerHTML=mk(NAV.filter(x=>x[0]!=='ventes'),'');
 $('#side').innerHTML='<div class="lg"><i>O</i>Octet</div>'+mk(NAV,'nv');
 $('#ttl').textContent=TT[cur];
 $('#vb').classList.toggle('on',cur==='ventes');
 $('#main').innerHTML=({dash,clients,stock,ventes,sav})[cur]();
 scrollTo(0,0)}
function clients(){
 return`<div class="bar2"><button class="bt" onclick="fClient()">Ajouter un client</button></div><div class="cards">${S.c.map(c=>{const a=S.d.filter(d=>d.c==c.id&&d.t==='Facture'&&d.s==='Payé').reduce((x,d)=>x+tot(d),0),n=S.r.filter(r=>r.c==c.id&&r.s!=='Récupéré').length;return`<div class="card" style="cursor:pointer" onclick="fiche(${c.id})"><div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="av">${E(ini(c.nom))}</div><div><b>${E(c.nom)}</b><div class="k">${E(c.ville)} · ${E(c.tel)}</div></div></div>${n?`<span class="pl in">${n} en SAV</span>`:''}</div><div class="row"><div><div class="k">Achats payés</div><b>${F(a)}</b></div><div style="text-align:right"><div class="k">Machines</div><b>${c.m.length}</b></div></div></div>`}).join('')}</div>`}
function stT(L){return`<div class="cards">${L.map(p=>`<div class="card ${p.q<3?'low':''}"><div class="row"><div><b>${E(p.ma+' '+p.mo)}</b><div class="k">${E(p.cat)}</div></div>${pill(p.et)}</div><div class="ch">${[p.cpu,p.ram,p.sto,p.gpu].filter(x=>x&&x!=='—').map(x=>`<span>${E(x)}</span>`).join('')}</div><div class="row"><span class="px">${F(p.px)}</span><span><button class="qb" onclick="adj(${p.id},-1)">−</button> <span class="pl ${p.q<3?'er':'ok'}">${p.q<3?'Stock bas · ':''}${p.q}</span> <button class="qb" onclick="adj(${p.id},1)">+</button></span></div></div>`).join('')||'<div class="em">Aucun produit ne correspond.</div>'}</div>`}
function ventes(){
 return`<div class="bar2"><button class="bt" onclick="fDoc()">Créer un devis</button></div><div class="cards">${S.d.slice().reverse().map(d=>`<div class="card"><div class="row"><div><b>${d.n}</b><div class="k">${d.t} · ${d.dt}</div></div>${pill(d.s)}</div><div><div style="font-weight:600">${E(cl(d.c).nom)}</div><div class="k">${d.l.map(l=>l.q+' × '+E(pr(l.p).mo)).join(', ')}</div></div><div class="row"><span class="px">${F(tot(d))}</span><select onchange="setS(${d.id},this.value)">${(d.t==='Devis'?['En attente','Annulé']:['En attente','Payé','Annulé']).map(s=>`<option ${s===d.s?'selected':''}>${s}</option>`).join('')}</select></div>${d.t==='Devis'&&d.s==='En attente'?`<button class="bt s" onclick="conv(${d.id})">Passer en facture</button>`:''}</div>`).join('')}</div>`}
const vb=document.createElement('button');vb.id='vb';vb.className='ib vb';vb.setAttribute('aria-label','Devis et factures');vb.innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="'+IC.ventes+'"/></svg>';vb.onclick=()=>nav('ventes');$('#tb').before(vb);
render();
</script>
</body>
</html>
